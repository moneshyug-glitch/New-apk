name: Build PWA Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Bubblewrap CLI
      run: npm i -g @bubblewrap/cli

    - name: Initialize and Build APK
      run: |
        # Non-interactive Bubblewrap build init using manifest
        bubblewrap init --manifest=https://raw.githubusercontent.com/moneshyug-glitch/New-apk/main/manifest.json --directory=android-project || true
        cd android-project || mkdir -p android-project && cd android-project
        
        # Agar init interactive ho jaye toh fallback ke taur par direct gradle build ya APK build trigger karenge
        echo "Build setup finished"
