name: Build PWA Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Generate Android App Package
      uses: pwabuilder/pwabuilder-android@main
      with:
        manifest_url: 'https://raw.githubusercontent.com/moneshyug-glitch/New-apk/main/manifest.json'
        name: 'Bharat Peyjal'
        package_id: 'com.moneshyug.newapk'
        icon_url: 'https://raw.githubusercontent.com/moneshyug-glitch/New-apk/main/icon.png'
        splash_color: '#ffffff'
        theme_color: '#ffffff'
        short_name: 'NewApp'
        lang: 'en'
        display: 'standalone'
        orientation: 'portrait'
        start_url: '/'
        
